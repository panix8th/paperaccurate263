name: release
# Builds the plugin, boot-tests it on Paper and publishes a GitHub release with the jar attached. Ways to
# cut a release (the tag is v<version from build.gradle>, e.g. v1.5.0+mc26.3):
#  - add/edit .github/release-notes/<tag>.md on the default branch: publishes that version if the notes
#    match the version in build.gradle and it isn't released yet (the notes become the release text)
#  - Actions tab -> release -> "Run workflow"
#  - push a tag like v1.5.0+mc26.3 yourself (it has to match the version in build.gradle)
# Without a notes file the text comes from the annotated tag message (tag push) or GitHub's generated notes.
on:
  push:
    branches: ['**']
    tags: ['v*']
    paths: ['.github/release-notes/**']   # not evaluated for tag pushes
  workflow_dispatch:

permissions:
  contents: write

env:
  MC_VERSION: "26.3"

jobs:
  release:
    # branch pushes only release from the default branch
    if: github.event_name != 'push' || github.ref_type == 'tag' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      USER_AGENT: "paperaccurate263-ci (https://github.com/${{ github.repository }})"
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: build
        run: ./gradlew build --stacktrace
      - name: work out the release tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          jars=(build/libs/PaperAccurateBlockPlacement-*.jar)
          if [ "${#jars[@]}" -ne 1 ]; then
            echo "::error::expected exactly one plugin jar, got: ${jars[*]}"
            exit 1
          fi
          version=$(basename "${jars[0]}" .jar)
          version=${version#PaperAccurateBlockPlacement-}
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            if [ "$tag" != "v$version" ]; then
              echo "::error::tag $tag doesn't match the jar version $version"
              exit 1
            fi
          else
            tag="v$version"
          fi
          publish=true
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = branch ]; then
            if [ ! -f ".github/release-notes/$tag.md" ]; then
              echo "::notice::no .github/release-notes/$tag.md for the current version, not releasing"
              publish=false
            elif gh release view "$tag" >/dev/null 2>&1; then
              echo "::notice::release $tag already exists, not releasing it again"
              publish=false
            fi
          fi
          echo "release tag: $tag, jar: ${jars[0]}, publish: $publish"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "jar=${jars[0]}" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: boot-test on paper ${{ env.MC_VERSION }}
        if: steps.tag.outputs.publish == 'true'
        env:
          JAR: ${{ steps.tag.outputs.jar }}
        run: |
          mkdir -p server/plugins
          cp "$JAR" server/plugins/
          bash .github/scripts/fetch-server.sh server
          bash .github/scripts/server-test.sh server
      - name: publish release
        if: steps.tag.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
          JAR: ${{ steps.tag.outputs.jar }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists, replacing its jar"
            gh release upload "$TAG" --clobber "$JAR"
            exit 0
          fi
          notes=".github/release-notes/$TAG.md"
          if [ -f "$notes" ]; then
            notes_args=(--notes-file "$notes")
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            notes_args=(--notes-from-tag)
          else
            notes_args=(--generate-notes)
          fi
          gh release create "$TAG" "$JAR" --target "$GITHUB_SHA" \
            --title "PaperAccurateBlockPlacement ${TAG#v}" "${notes_args[@]}"
          gh release view "$TAG"
