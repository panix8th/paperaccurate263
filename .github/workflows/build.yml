name: build
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MC_VERSION: "26.3"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v5
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v5
      - name: build
        run: ./gradlew build --stacktrace
      - name: show resolved paper-api / packetevents versions
        run: ./gradlew -q dependencies --configuration compileClasspath | grep -E 'paper-api|packetevents' | sort -u
      - name: list built jars
        run: ls -la build/libs
      - name: upload plugin jar
        uses: actions/upload-artifact@v6
        with:
          name: PaperAccurateBlockPlacement-mc${{ env.MC_VERSION }}
          path: build/libs/*.jar
          if-no-files-found: error

  # boots a real Paper server with packetevents + the freshly built jar and checks the plugin enables
  server-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      USER_AGENT: "paperaccurate263-ci (https://github.com/${{ github.repository }})"
    steps:
      - name: checkout repository
        uses: actions/checkout@v5
      - name: download plugin jar
        uses: actions/download-artifact@v7
        with:
          name: PaperAccurateBlockPlacement-mc${{ env.MC_VERSION }}
          path: server/plugins
      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: temurin
      - name: download paper + packetevents
        run: bash .github/scripts/fetch-server.sh server
      - name: boot server and run checks
        run: bash .github/scripts/server-test.sh server
      - name: upload server log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: server-log-mc${{ env.MC_VERSION }}
          path: server/server-out.log
          if-no-files-found: ignore
